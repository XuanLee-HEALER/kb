# KB · etmesh-internal ingress
#
# Binds 10.177.0.1:443 (etmesh tun0 only — never the public eth0).
# TLS terminates here; downstream services are plain HTTP on loopback.
#
# Bearer token check on /mcp lives in /etc/nginx/snippets/kb-auth.conf
# (provisioned in Phase 1 — see deploy/README.md). That file holds the
# actual secret and is gitignored / never committed.

server {
    listen 10.177.0.1:443 ssl http2;
    server_name kb.lan;

    ssl_certificate     /etc/nginx/ssl/kb.lan.crt;
    ssl_certificate_key /etc/nginx/ssl/kb.lan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:kb_lan_tls:1m;
    ssl_session_timeout 1d;

    # MCP — bearer-gated, direct to Rust kb-server. Streaming-friendly.
    # rmcp 1.6 has DNS-rebinding protection (only accepts Host: 127.0.0.1 by
    # default). We rewrite Host to satisfy that check; X-Forwarded-Host
    # preserves the original for app-level logic if anything cares.
    location /mcp {
        include /etc/nginx/snippets/kb-auth.conf;
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Skill bundle / install plan / version probe — direct to kb-server (the
    # web tier doesn't serve any /skill/* routes). install plan must be
    # reachable from inside Claude Code over https://kb.lan/skill/install
    # to bootstrap the MCP registration, so this can't live behind the web
    # tier. Auth-free on purpose; only reachable via etmesh.
    location /skill/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else (pages, the web tier's own /api/* form handlers,
    # /styles/*, /js/*) → web (Hono on Bun). Note: web's /api/* is for
    # browser form submits and returns 303 redirects; kb-server's /api/*
    # is the JSON REST surface used by kb CLI and direct HTTP clients
    # (those hit kb-server on 5100 directly, not via this vhost).
    location / {
        proxy_pass http://127.0.0.1:5101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    client_max_body_size 4m;

    access_log /var/log/nginx/kb.lan.access.log;
    error_log  /var/log/nginx/kb.lan.error.log;
}
