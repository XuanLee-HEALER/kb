name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write    # needed by softprops/action-gh-release to create/attach to the GitHub Release

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential

      - uses: Swatinem/rust-cache@v2
        with: { shared-key: "release-${{ runner.os }}" }

      - name: Install web deps
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build release bundle
        run: just build-release

      - name: Locate artifact
        id: artifact
        run: |
          file=$(ls kb-release-*.tar.gz | head -1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -lh "$file"

      - uses: actions/upload-artifact@v4
        with:
          name: kb-release-linux-x86_64
          path: ${{ steps.artifact.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.file }}
          generate_release_notes: true
